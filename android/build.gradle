// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Set temp directory for SQLite JDBC on Windows to avoid permission issues
if (System.getProperty("os.name").toLowerCase().contains("windows")) {
    def userHome = System.getProperty("user.home")
    def tempDir = new File(userHome, "AppData/Local/Temp")
    if (tempDir.exists() || tempDir.mkdirs()) {
        def tempDirPath = tempDir.absolutePath
        System.setProperty("java.io.tmpdir", tempDirPath)
        System.setProperty("org.gradle.workers.tmp", tempDirPath)
    }
}

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '34.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '23')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '34')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.23'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.1")
        // React Native gradle plugin is included via includeBuild in settings.gradle
        // The included build should satisfy this dependency automatically
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
